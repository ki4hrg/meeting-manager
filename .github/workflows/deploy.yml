name: build & deploy

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled on a pull request and never on main, where every
# commit produces an image tagged with its own sha.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A red suite produces no image, so nothing reaches GHCR and `deploy` never fires.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Testcontainers starts Postgres; Docker is present on the runner.
      - run: pnpm test

  # The app in a browser: the main journeys, and every main page at phone width.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  image:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR rejects uppercase in a repository path.
      - id: image-name
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image-name.outputs.value }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Stamps org.opencontainers.image.revision, for checking what is running.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          # `ignore-error`: the cache is an optimisation and must not fail a good build.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,ignore-error=true' || '' }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dockhand sync
        env:
          WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL || vars.DOCKHAND_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.DOCKHAND_WEBHOOK_TOKEN || vars.DOCKHAND_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DOCKHAND_WEBHOOK_URL not set — skipping deploy notification."; exit 0
          fi
          url="$WEBHOOK_URL"
          if [ -n "$WEBHOOK_TOKEN" ]; then
            case "$url" in
              *\?*) url="$url&secret=$WEBHOOK_TOKEN" ;;
              *)    url="$url?secret=$WEBHOOK_TOKEN" ;;
            esac
          fi
          # Dockhand answers 200 with {"success":false,...} when the stack does not
          # come up, so the body is the outcome, not the status code.
          response=$(curl -fsS --retry 3 --retry-delay 5 "$url")
          echo "$response"

          if printf '%s' "$response" | jq -e '.success == false' >/dev/null 2>&1; then
            echo "::error::Dockhand reported a failed deploy — see the error field above."
            exit 1
          fi
