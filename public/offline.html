<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Meeting Manager</title>
<style>
  :root { color-scheme: light dark; --bg: #f9fafb; --card: #fff; --fg: #111827; --muted: #6b7280; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --card: #1f2937; --fg: #f3f4f6; --muted: #9ca3af; --accent: #3b82f6; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); padding: 32px; text-align: center; max-width: 320px; width: 100%; }
  svg { width: 40px; height: 40px; color: var(--muted); }
  h1 { font-size: 18px; margin: 12px 0 20px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 3l18 18M8.5 16.5a5 5 0 017 0M5 13a10 10 0 015.17-2.8M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M12 20h.01"/>
    </svg>
    <h1>Offline</h1>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
</main>
</body>
</html>
