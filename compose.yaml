name: meeting-manager

services:
  app:
    # Built and pushed by GitHub Actions. No `build:` block: this stack only pulls.
    image: ${APP_IMAGE:-ghcr.io/ki4hrg/meeting-manager:main}
    # `:main` is a mutable tag and `docker compose up` will not re-pull a tag that
    # already exists locally. Without this the redeploy keeps running old code.
    pull_policy: always
    restart: unless-stopped
    environment:
      # The password travels beside the URL, not inside it: postgres-js parses the
      # URL with `new URL()`, and a `/` in the password breaks it. It reads
      # PGPASSWORD natively.
      DATABASE_URL: postgres://mm@db:5432/mm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # The external HTTPS origin. OAuth discovery is built from it.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Google OAuth for calendar integration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Todoist, through the registered app. Both or neither; one alone fails the
      # boot. Its OAuth redirect is ${PUBLIC_BASE_URL}/api/connect/todoist/callback
      # and its webhook ${PUBLIC_BASE_URL}/api/webhooks/todoist.
      TODOIST_CLIENT_ID: ${TODOIST_CLIENT_ID:-}
      TODOIST_CLIENT_SECRET: ${TODOIST_CLIENT_SECRET:-}
      # Encryption key for stored credentials
      CONNECT_KEY: ${CONNECT_KEY:-}
      # Extraction after a meeting. With no key, processing keeps only the
      # D:/Q:/A:/T: lines John wrote himself.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-claude-fable-5-1}
      # Granola is connected on Settings and registers its own webhook at
      # PUBLIC_BASE_URL. Only for an endpoint made by hand: its signing secret.
      GRANOLA_WEBHOOK_SECRET: ${GRANOLA_WEBHOOK_SECRET:-}
      # Single sign-on. Off unless issuer, id and secret are all set; two of three
      # fails the boot. The provider's redirect URI is
      # ${PUBLIC_BASE_URL}/api/auth/oidc/callback.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
      # `true` hides and refuses passwords, but only while the provider answers.
      OIDC_ONLY: ${OIDC_ONLY:-}
      # `true` links the account by email even when the address is unverified.
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
      # `off` keeps this container from running background jobs.
      WORKER: ${WORKER:-}
      # Times are formatted on the server; unset, a container is UTC.
      TZ: ${TZ:-America/Chicago}
    healthcheck:
      # The entrypoint applies migrations before the server listens, hence the
      # longer start_period. /api/health checks the database as well.
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    ports:
      # APP_PORT is required with no default: left bare, an unset value makes
      # Docker publish on a random port and the proxy points at nothing.
      - '${APP_BIND:-0.0.0.0}:${APP_PORT:?set APP_PORT — the host port the reverse proxy forwards to}:3000'

  db:
    image: postgres:18-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mm
    volumes:
      # PG18 keeps data in a version subdirectory and wants the mount at
      # /var/lib/postgresql, not /var/lib/postgresql/data.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mm']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata18:
